<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PustakaNusa</title><link rel="stylesheet" href="/app.css"><style>.public-head{min-height:68px;padding:14px max(24px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e5e1d8}.brand-public{font-size:18px;font-weight:700;color:#16314f;text-decoration:none}.public-login{margin-left:auto}.public-wrap{padding-top:32px}.back-link{display:inline-block;margin-bottom:18px;color:#2d7d5f;text-decoration:none;font-weight:700}.click-row{cursor:pointer}.click-row:hover{background:#f4f1ea}.detail-card{margin-top:18px}.nav-badge{float:right;min-width:18px;padding:1px 5px;border-radius:10px;background:#e05a4f;color:#fff;font-size:10px;text-align:center}.loan-chart{height:205px;display:flex;align-items:end;gap:26px;padding:16px 12px 0;border-bottom:1px solid #e5e1d8}.chart-item{flex:1;min-width:70px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.chart-bar{width:min(64px,100%);background:#2d7d5f;border-radius:7px 7px 0 0}.chart-value{font-weight:700}.chart-item span{font-size:12px;color:#6f7b87;text-transform:capitalize}@media(max-width:720px){.public-head{padding:14px 16px}.loan-chart{gap:10px}.chart-item{min-width:0}.chart-item span{font-size:10px}}</style></head><body><div id="app"></div><script type="module" src="/app.js"></script></body></html>
